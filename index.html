<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Qplayer - Winamp & MilkDrop Audio Visualizer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #00ffcc;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Top Bar & HUD */
        #top-hud {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .hud-group {
            display: flex;
            gap: 12px;
            align-items: center;
            pointer-events: auto;
        }

        .brand-title {
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid #00ffcc55;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 1px;
            color: #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-title span {
            color: #ff0077;
            font-size: 11px;
            border: 1px solid #ff0077;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .hud-btn {
            background: rgba(15, 15, 30, 0.85);
            border: 1px solid #00ffcc44;
            color: #00ffcc;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .hud-btn:hover {
            background: #00ffcc;
            color: #050508;
            box-shadow: 0 0 15px #00ffcc88;
        }

        .hud-select {
            background: rgba(15, 15, 30, 0.85);
            border: 1px solid #00ffcc44;
            color: #00ffcc;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .hud-select option {
            background: #111;
            color: #00ffcc;
        }

        /* Bottom Winamp Deck */
        #player-dock {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 720px;
            max-width: 95vw;
            background: linear-gradient(135deg, rgba(16, 16, 28, 0.92), rgba(8, 8, 16, 0.95));
            border: 2px solid #00ffcc66;
            border-radius: 10px;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 10px 35px rgba(0,0,0,0.8), 0 0 25px rgba(0, 255, 204, 0.2);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .dock-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .dock-row:last-child {
            margin-bottom: 0;
        }

        /* LCD Display & Marquee */
        .lcd-display {
            flex-grow: 1;
            background: #020806;
            border: 1px inset #00ffcc44;
            border-radius: 5px;
            padding: 8px 12px;
            height: 42px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .lcd-track-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            color: #00ffcc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(0,255,204,0.6);
        }

        .lcd-sub {
            display: flex;
            justify-content: space-between;
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            color: #00bb99;
            margin-top: 2px;
        }

        /* Transport Controls */
        .transport-group {
            display: flex;
            gap: 6px;
        }

        .t-btn {
            background: #1a1a2e;
            border: 1px solid #00ffcc55;
            color: #00ffcc;
            width: 34px;
            height: 32px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .t-btn:hover {
            background: #00ffcc;
            color: #050508;
        }

        .t-btn.active {
            background: #ff0077;
            border-color: #ff0077;
            color: #fff;
            box-shadow: 0 0 10px #ff0077;
        }

        /* Seek Bar */
        .seek-container {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .time-label {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: #00ffcc;
            min-width: 36px;
            text-align: center;
        }

        .seek-slider {
            flex-grow: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: #0a0a14;
            border: 1px solid #00ffcc44;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            cursor: pointer;
        }

        /* Volume & Mic Strips */
        .mixer-strip {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 11px;
            color: #aaa;
        }

        .mixer-control {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mixer-control input[type="range"] {
            width: 80px;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: #0a0a14;
            border: 1px solid #00ffcc33;
            border-radius: 2px;
            outline: none;
        }

        .mixer-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0077;
            cursor: pointer;
        }

        /* Playlist Modal Window */
        #playlist-window {
            position: absolute;
            top: 75px;
            right: 25px;
            width: 380px;
            height: 380px;
            background: rgba(12, 12, 22, 0.95);
            border: 2px solid #00ffcc66;
            border-radius: 8px;
            z-index: 20;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
        }

        .playlist-header {
            background: #1a1a2e;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #00ffcc44;
            cursor: move;
        }

        .playlist-close {
            background: none;
            border: none;
            color: #ff0077;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .playlist-body {
            flex-grow: 1;
            overflow-y: auto;
            padding: 6px;
        }

        .playlist-item {
            padding: 6px 10px;
            margin-bottom: 3px;
            background: rgba(255,255,255,0.03);
            border: 1px solid transparent;
            border-radius: 4px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .playlist-item:hover {
            background: rgba(0,255,204,0.1);
            border-color: #00ffcc33;
        }

        .playlist-item.playing {
            background: rgba(0,255,204,0.2);
            border-color: #00ffcc;
            color: #00ffcc;
            font-weight: bold;
        }

        .playlist-item.dragging {
            opacity: 0.4;
            border: 1px dashed #ff0077;
        }

        .playlist-footer {
            padding: 8px;
            background: #0a0a14;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #00ffcc44;
        }

        /* Drag & Drop Overlay */
        #drop-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border: 4px dashed #00ffcc;
        }

        #drop-overlay h2 {
            font-size: 28px;
            color: #00ffcc;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ffcc;
        }

        #file-input {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a14;
        }
        ::-webkit-scrollbar-thumb {
            background: #00ffcc44;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00ffcc;
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="visualizer-canvas"></canvas>
    </div>

    <!-- Drag and Drop Overlay -->
    <div id="drop-overlay">
        <h2>Drop MP3s or Playlists Here</h2>
        <p style="color: #aaa; font-size: 14px;">Release files to load them instantly into Smart Qplayer</p>
    </div>

    <input type="file" id="file-input" multiple accept="audio/mpeg,audio/mp3,audio/wav,audio/ogg,audio/flac,audio/aac,audio/m4a,audio/opus,audio/x-m3u,audio/m3u8,audio/pls" />

    <!-- Top HUD Bar -->
    <div id="top-hud">
        <div class="hud-group">
            <div class="brand-title">Smart Qplayer <span>MP3 + MilkDrop</span></div>
            <button class="hud-btn" id="btn-load-files">+ Load MP3s / PL</button>
            <button class="hud-btn" id="btn-playlist-toggle">PL (P)</button>
            <button class="hud-btn" id="btn-popout" title="Open Popout Visualizer Mirror Window">POP (Mirror)</button>
        </div>
        <div class="hud-group">
            <select class="hud-select" id="preset-select">
                <option value="0">1: Kaleidoscope Tunnel</option>
                <option value="1">2: Winamp LED Spectrum</option>
                <option value="2">3: Warp Starfield & Bass</option>
                <option value="3">4: Lissajous Oscilloscope</option>
                <option value="4" selected>5: Auto-Cycle Presets</option>
            </select>
            <select class="hud-select" id="theme-select">
                <option value="cyber">Theme: Cyber Neon</option>
                <option value="winamp">Theme: Winamp Green</option>
                <option value="fire">Theme: Fire Amber</option>
                <option value="synth">Theme: Synthwave Pink</option>
                <option value="rainbow">Theme: Acid Rainbow</option>
            </select>
            <button class="hud-btn" id="btn-hud-toggle" title="Toggle HUD visibility">HUD (H)</button>
        </div>
    </div>

    <!-- Winamp Classic Control Deck -->
    <div id="player-dock">
        <!-- Row 1: LCD & Transport -->
        <div class="dock-row">
            <div class="lcd-display">
                <div class="lcd-track-title" id="lcd-title">Smart Qplayer Ready — Drop MP3s or Load Playlist</div>
                <div class="lcd-sub">
                    <span id="lcd-status">STOPPED</span>
                    <span id="lcd-samplerate">44.1kHz / Stereo</span>
                </div>
            </div>
            <div class="transport-group">
                <button class="t-btn" id="btn-prev" title="Previous Track">|&lt;</button>
                <button class="t-btn" id="btn-play" title="Play">></button>
                <button class="t-btn" id="btn-pause" title="Pause">||</button>
                <button class="t-btn" id="btn-stop" title="Stop">[]</button>
                <button class="t-btn" id="btn-next" title="Next Track">&gt;|</button>
            </div>
        </div>

        <!-- Row 2: Seek Bar -->
        <div class="dock-row">
            <div class="time-label" id="lbl-current">00:00</div>
            <input type="range" class="seek-slider" id="seek-bar" min="0" max="100" value="0" step="0.1">
            <div class="time-label" id="lbl-duration">00:00</div>
        </div>

        <!-- Row 3: Modes & Mixer Strip -->
        <div class="dock-row">
            <div class="transport-group">
                <button class="t-btn" id="btn-shuffle" title="Toggle Random Shuffle">SHUF</button>
                <button class="t-btn" id="btn-repeat" title="Repeat Mode">REP</button>
                <button class="t-btn" id="btn-synth" title="Test Synth Beat">BEAT</button>
            </div>
            <div class="mixer-strip">
                <div class="mixer-control">
                    <span>VOL</span>
                    <input type="range" id="vol-slider" min="0" max="150" value="100">
                    <button class="t-btn" id="btn-mute" style="width: 48px; height: 24px; font-size: 10px;">MUTE</button>
                </div>
                <div class="mixer-control">
                    <span>MIC</span>
                    <input type="range" id="mic-slider" min="0" max="200" value="0">
                    <button class="t-btn" id="btn-mic-toggle" style="width: 48px; height: 24px; font-size: 10px;">OFF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Playlist Window -->
    <div id="playlist-window">
        <div class="playlist-header" id="playlist-header">
            <span>Playlist Editor (<span id="pl-count">0</span> tracks)</span>
            <button class="playlist-close" id="btn-playlist-close">×</button>
        </div>
        <div class="playlist-body" id="playlist-list"></div>
        <div class="playlist-footer">
            <button class="hud-btn" id="btn-pl-add" style="font-size: 11px; padding: 4px 8px;">+ Add Files</button>
            <button class="hud-btn" id="btn-pl-shuffle" style="font-size: 11px; padding: 4px 8px;">Randomize</button>
            <button class="hud-btn" id="btn-pl-save" style="font-size: 11px; padding: 4px 8px;">Save PL (.m3u)</button>
            <button class="hud-btn" id="btn-pl-clear" style="font-size: 11px; padding: 4px 8px; color: #ff0077; border-color: #ff007744;">Clear</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let audioElement = new Audio();
        audioElement.crossOrigin = "anonymous";
        
        let sourceNode = null;
        let analyserLeft = null;
        let analyserRight = null;
        let analyserMaster = null;
        let gainNode = null;
        let muteNode = null;
        
        let micStream = null;
        let micSource = null;
        let micGainNode = null;
        let isMicActive = false;

        let synthOsc = null;
        let synthGain = null;
        let isSynthActive = false;

        let playlist = [];
        let currentIndex = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0: All, 1: One, 2: Off
        let isMuted = false;
        let previousVolume = 1.0;

        let currentPreset = 4;
        let currentTheme = 'cyber';
        let presetTimer = 0;

        let canvas, ctx;
        let width, height;
        let time = 0;
        let particles = [];
        let zoom = 1;
        let rot = 0;

        // Popout mirror window reference
        let popoutWindow = null;

        const themes = {
            cyber: { bg: '#050508', primary: '#00ffcc', secondary: '#ff0077', accent: '#7000ff' },
            winamp: { bg: '#020804', primary: '#00ff33', secondary: '#ffcc00', accent: '#00ccff' },
            fire: { bg: '#080402', primary: '#ff6600', secondary: '#ffcc00', accent: '#ff0033' },
            synth: { bg: '#080208', primary: '#ff00aa', secondary: '#00ffff', accent: '#9900ff' },
            rainbow: { bg: '#040408', primary: '#00ffcc', secondary: '#ff0077', accent: '#ffff00' }
        };

        window.addEventListener('load', () => {
            initAudioEngine();
            initCanvas();
            initUI();
            initDragAndDrop();
            requestAnimationFrame(renderLoop);
        });

        function initAudioEngine() {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();

            gainNode = audioCtx.createGain();
            muteNode = audioCtx.createGain();
            
            analyserMaster = audioCtx.createAnalyser();
            analyserLeft = audioCtx.createAnalyser();
            analyserRight = audioCtx.createAnalyser();

            analyserMaster.fftSize = 512;
            analyserLeft.fftSize = 512;
            analyserRight.fftSize = 512;
            analyserMaster.smoothingTimeConstant = 0.8;

            const splitter = audioCtx.createChannelSplitter(2);
            
            sourceNode = audioCtx.createMediaElementSource(audioElement);
            
            // --- CRITICAL REQUIREMENT ---
            // Analyzer pipeline taps BEFORE muteNode so visuals run when muted
            sourceNode.connect(analyserMaster);
            sourceNode.connect(splitter);
            splitter.connect(analyserLeft, 0);
            splitter.connect(analyserRight, 1);

            // Audio signal path to speakers
            sourceNode.connect(gainNode);
            gainNode.connect(muteNode);
            muteNode.connect(audioCtx.destination);

            audioElement.addEventListener('ended', onTrackEnded);
            audioElement.addEventListener('timeupdate', updateSeekUI);
            audioElement.addEventListener('loadedmetadata', () => {
                document.getElementById('lbl-duration').textContent = formatTime(audioElement.duration);
            });
        }

        function initCanvas() {
            canvas = document.getElementById('visualizer-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            for(let i=0; i<250; i++) {
                particles.push({
                    x: (Math.random() - 0.5) * window.innerWidth,
                    y: (Math.random() - 0.5) * window.innerHeight,
                    z: Math.random() * window.innerWidth,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function initUI() {
            document.getElementById('btn-play').addEventListener('click', playAudio);
            document.getElementById('btn-pause').addEventListener('click', pauseAudio);
            document.getElementById('btn-stop').addEventListener('click', stopAudio);
            document.getElementById('btn-prev').addEventListener('click', playPrevTrack);
            document.getElementById('btn-next').addEventListener('click', playNextTrack);

            document.getElementById('btn-shuffle').addEventListener('click', toggleShuffle);
            document.getElementById('btn-repeat').addEventListener('click', toggleRepeat);
            document.getElementById('btn-synth').addEventListener('click', toggleSynthBeat);
            document.getElementById('btn-mic-toggle').addEventListener('click', toggleMicrophone);
            document.getElementById('btn-mute').addEventListener('click', toggleMute);

            document.getElementById('vol-slider').addEventListener('input', (e) => {
                const val = e.target.value / 100;
                gainNode.gain.value = val;
                if(val > 0 && isMuted) {
                    isMuted = false;
                    muteNode.gain.value = 1.0;
                    const btn = document.getElementById('btn-mute');
                    btn.classList.remove('active');
                    btn.textContent = 'MUTE';
                }
            });

            document.getElementById('mic-slider').addEventListener('input', (e) => {
                if(micGainNode) micGainNode.gain.value = e.target.value / 100;
            });

            const seekBar = document.getElementById('seek-bar');
            seekBar.addEventListener('input', (e) => {
                if(audioElement.duration) {
                    audioElement.currentTime = (e.target.value / 100) * audioElement.duration;
                }
            });

            document.getElementById('btn-load-files').addEventListener('click', () => document.getElementById('file-input').click());
            document.getElementById('btn-pl-add').addEventListener('click', () => document.getElementById('file-input').click());
            document.getElementById('file-input').addEventListener('change', handleFileSelect);

            document.getElementById('btn-playlist-toggle').addEventListener('click', togglePlaylistWindow);
            document.getElementById('btn-playlist-close').addEventListener('click', togglePlaylistWindow);

            document.getElementById('btn-popout').addEventListener('click', openPopoutMirrorWindow);

            document.getElementById('btn-pl-shuffle').addEventListener('click', randomizePlaylist);
            document.getElementById('btn-pl-save').addEventListener('click', savePlaylistM3U);
            document.getElementById('btn-pl-clear').addEventListener('click', clearPlaylist);

            document.getElementById('preset-select').addEventListener('change', (e) => {
                currentPreset = parseInt(e.target.value);
            });

            document.getElementById('theme-select').addEventListener('change', (e) => {
                currentTheme = e.target.value;
            });

            window.addEventListener('keydown', (e) => {
                if(e.key.toLowerCase() === 'h') {
                    const hud = document.getElementById('top-hud');
                    const dock = document.getElementById('player-dock');
                    const hidden = hud.style.opacity === '0';
                    hud.style.opacity = hidden ? '1' : '0';
                    dock.style.opacity = hidden ? '1' : '0';
                }
                if(e.key.toLowerCase() === 'f') {
                    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
                    else if(document.exitFullscreen) document.exitFullscreen();
                }
                if(e.key.toLowerCase() === 'p') {
                    togglePlaylistWindow();
                }
                if(e.code === 'Space' && e.target.tagName !== 'INPUT') {
                    e.preventDefault();
                    toggleSynthBeat();
                }
            });
        }

        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            addFilesToPlaylist(files);
        }

        function addFilesToPlaylist(files) {
            files.forEach(file => {
                if(file.name.endsWith('.m3u') || file.name.endsWith('.pls')) {
                    parsePlaylistFile(file);
                } else if(file.type.startsWith('audio/') || file.name.match(/\.(mp3|wav|ogg|flac|aac|m4a|opus)$/i)) {
                    const url = URL.createObjectURL(file);
                    playlist.push({ name: file.name.replace(/\.[^/.]+$/, ""), file: file, url: url, duration: 0 });
                }
            });

            updatePlaylistUI();
            if(currentIndex === -1 && playlist.length > 0) {
                loadTrack(0);
            }
        }

        function parsePlaylistFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const lines = e.target.result.split('\n');
                lines.forEach(line => {
                    line = line.trim();
                    if(line && !line.startsWith('#')) {
                        playlist.push({ name: line.split('/').pop().replace(/\.[^/.]+$/, ""), file: null, url: line, duration: 0 });
                    }
                });
                updatePlaylistUI();
                if(currentIndex === -1 && playlist.length > 0) loadTrack(0);
            };
            reader.readAsText(file);
        }

        function loadTrack(index) {
            if(index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];

            audioElement.src = track.url;
            audioElement.load();
            
            document.getElementById('lcd-title').textContent = `${currentIndex + 1}. ${track.name}`;
            document.getElementById('lcd-status').textContent = 'PLAYING';

            if(audioCtx.state === 'suspended') audioCtx.resume();
            audioElement.play().catch(err => console.log("Autoplay prevented:", err));

            updatePlaylistUI();
        }

        function playAudio() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            if(playlist.length === 0) {
                document.getElementById('file-input').click();
                return;
            }
            if(currentIndex === -1) currentIndex = 0;
            audioElement.play();
            document.getElementById('lcd-status').textContent = 'PLAYING';
        }

        function pauseAudio() {
            audioElement.pause();
            document.getElementById('lcd-status').textContent = 'PAUSED';
        }

        function stopAudio() {
            audioElement.pause();
            audioElement.currentTime = 0;
            document.getElementById('lcd-status').textContent = 'STOPPED';
        }

        function playPrevTrack() {
            if(playlist.length === 0) return;
            let nextIdx = currentIndex - 1;
            if(nextIdx < 0) nextIdx = playlist.length - 1;
            loadTrack(nextIdx);
        }

        function playNextTrack() {
            if(playlist.length === 0) return;
            let nextIdx;
            if(isShuffle) {
                nextIdx = Math.floor(Math.random() * playlist.length);
            } else {
                nextIdx = currentIndex + 1;
                if(nextIdx >= playlist.length) nextIdx = 0;
            }
            loadTrack(nextIdx);
        }

        function onTrackEnded() {
            if(repeatMode === 1) {
                audioElement.currentTime = 0;
                audioElement.play();
            } else {
                playNextTrack();
            }
        }

        function updateSeekUI() {
            if(!audioElement.duration) return;
            const pct = (audioElement.currentTime / audioElement.duration) * 100;
            document.getElementById('seek-bar').value = pct;
            document.getElementById('lbl-current').textContent = formatTime(audioElement.currentTime);
        }

        function formatTime(secs) {
            if(isNaN(secs)) return "00:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            const btn = document.getElementById('btn-shuffle');
            if(isShuffle) {
                btn.classList.add('active');
                randomizePlaylist();
            } else {
                btn.classList.remove('active');
            }
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            const btn = document.getElementById('btn-repeat');
            if(repeatMode === 0) { btn.textContent = 'REP'; btn.classList.remove('active'); }
            else if(repeatMode === 1) { btn.textContent = 'ONE'; btn.classList.add('active'); }
            else { btn.textContent = 'OFF'; btn.classList.remove('active'); }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById('btn-mute');
            if(isMuted) {
                muteNode.gain.value = 0.0;
                btn.classList.add('active');
                btn.textContent = 'MUTED';
            } else {
                muteNode.gain.value = 1.0;
                btn.classList.remove('active');
                btn.textContent = 'MUTE';
            }
        }

        function randomizePlaylist() {
            if(playlist.length <= 1) return;
            const currentTrack = playlist[currentIndex];
            for (let i = playlist.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [playlist[i], playlist[j]] = [playlist[j], playlist[i]];
            }
            if(currentTrack) {
                currentIndex = playlist.indexOf(currentTrack);
            }
            updatePlaylistUI();
        }

        function clearPlaylist() {
            audioElement.pause();
            audioElement.src = "";
            playlist = [];
            currentIndex = -1;
            updatePlaylistUI();
            document.getElementById('lcd-title').textContent = "Smart Qplayer Ready — Drop MP3s or Load Playlist";
            document.getElementById('lcd-status').textContent = "STOPPED";
        }

        function savePlaylistM3U() {
            if(playlist.length === 0) return;
            let content = "#EXTM3U\n";
            playlist.forEach(item => {
                content += `#EXTINF:-1,${item.name}\n${item.name}\n`;
            });
            const blob = new Blob([content], { type: 'audio/x-mpegurl' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'smart-qplayer-playlist.m3u';
            a.click();
            URL.revokeObjectURL(url);
        }

        function togglePlaylistWindow() {
            const win = document.getElementById('playlist-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        }

        function openPopoutMirrorWindow() {
            if (popoutWindow && !popoutWindow.closed) {
                popoutWindow.focus();
                return;
            }

            popoutWindow = window.open('', 'SmartQplayerVisualizerMirror', 'width=960,height=540,menubar=no,toolbar=no,location=no,status=no');
            if (!popoutWindow) {
                alert("Pop-up blocked! Please allow pop-ups for this site to use the visualizer mirror.");
                return;
            }

            popoutWindow.document.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <title>Smart Qplayer - Visualizer Mirror</title>
                    <style>
                        body, html {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background-color: #050508;
                        }
                        canvas {
                            display: block;
                            width: 100%;
                            height: 100%;
                        }
                    </style>
                </head>
                <body>
                    <canvas id="mirror-canvas"></canvas>
                </body>
                </html>
            `);
            popoutWindow.document.close();
        }

        function updatePlaylistUI() {
            const listEl = document.getElementById('playlist-list');
            listEl.innerHTML = '';
            document.getElementById('pl-count').textContent = playlist.length;

            playlist.forEach((track, idx) => {
                const item = document.createElement('div');
                item.className = `playlist-item ${idx === currentIndex ? 'playing' : ''}`;
                item.draggable = true;
                item.innerHTML = `<span>${idx + 1}. ${track.name}</span><span style="font-size:10px;opacity:0.6;">⋮⋮</span>`;
                
                item.addEventListener('click', () => loadTrack(idx));

                item.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', idx);
                    item.classList.add('dragging');
                });
                item.addEventListener('dragend', () => item.classList.remove('dragging'));
                item.addEventListener('dragover', (e) => e.preventDefault());
                item.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
                    const toIdx = idx;
                    if(fromIdx !== toIdx) {
                        const moved = playlist.splice(fromIdx, 1)[0];
                        playlist.splice(toIdx, 0, moved);
                        if(currentIndex === fromIdx) currentIndex = toIdx;
                        else if(currentIndex === toIdx && fromIdx > toIdx) currentIndex++;
                        else if(currentIndex === toIdx && fromIdx < toIdx) currentIndex--;
                        updatePlaylistUI();
                    }
                });

                listEl.appendChild(item);
            });
        }

        function initDragAndDrop() {
            const overlay = document.getElementById('drop-overlay');
            window.addEventListener('dragenter', (e) => { e.preventDefault(); overlay.style.display = 'flex'; });
            overlay.addEventListener('dragleave', (e) => { e.preventDefault(); overlay.style.display = 'none'; });
            overlay.addEventListener('dragover', (e) => e.preventDefault());
            overlay.addEventListener('drop', (e) => {
                e.preventDefault();
                overlay.style.display = 'none';
                if(e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    addFilesToPlaylist(Array.from(e.dataTransfer.files));
                }
            });
        }

        async function toggleMicrophone() {
            const btn = document.getElementById('btn-mic-toggle');
            if(!isMicActive) {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
                    if(audioCtx.state === 'suspended') await audioCtx.resume();
                    
                    micSource = audioCtx.createMediaStreamSource(micStream);
                    micGainNode = audioCtx.createGain();
                    micGainNode.gain.value = document.getElementById('mic-slider').value / 100;
                    
                    micSource.connect(micGainNode);
                    micGainNode.connect(analyserMaster);

                    isMicActive = true;
                    btn.classList.add('active');
                    btn.textContent = 'ON';
                } catch(err) {
                    console.log("Microphone permission denied or unavailable.");
                }
            } else {
                if(micStream) micStream.getTracks().forEach(t => t.stop());
                if(micSource) micSource.disconnect();
                isMicActive = false;
                btn.classList.remove('active');
                btn.textContent = 'OFF';
            }
        }

        function toggleSynthBeat() {
            const btn = document.getElementById('btn-synth');
            if(!isSynthActive) {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                synthOsc = audioCtx.createOscillator();
                synthGain = audioCtx.createGain();

                synthOsc.type = 'sawtooth';
                synthOsc.frequency.setValueAtTime(110, audioCtx.currentTime);

                const lfo = audioCtx.createOscillator();
                lfo.frequency.value = 4;
                const lfoGain = audioCtx.createGain();
                lfoGain.gain.value = 220;
                lfo.connect(lfoGain);
                lfoGain.connect(synthOsc.frequency);
                lfo.start();

                synthGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                synthOsc.connect(synthGain);
                synthGain.connect(analyserMaster);
                
                synthOsc.start();
                isSynthActive = true;
                btn.classList.add('active');
            } else {
                if(synthOsc) { synthOsc.stop(); synthOsc.disconnect(); }
                isSynthActive = false;
                btn.classList.remove('active');
            }
        }

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            time += 0.016;

            if(currentPreset === 4) {
                presetTimer += 0.016;
                if(presetTimer > 15) {
                    presetTimer = 0;
                    const sel = document.getElementById('preset-select');
                    let nextIdx = (parseInt(sel.value) + 1) % 4;
                    if(nextIdx === 4) nextIdx = 0;
                    currentPreset = nextIdx;
                }
            }

            const theme = themes[currentTheme];
            
            const freqData = new Uint8Array(analyserMaster.frequencyBinCount);
            analyserMaster.getByteFrequencyData(freqData);

            const timeDataLeft = new Uint8Array(analyserLeft.fftSize);
            const timeDataRight = new Uint8Array(analyserRight.fftSize);
            analyserLeft.getByteTimeDomainData(timeDataLeft);
            analyserRight.getByteTimeDomainData(timeDataRight);

            let bassSum = 0;
            for(let i=0; i<15; i++) bassSum += freqData[i];
            let bass = bassSum / 15 / 255;

            // Render to main canvas
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, width, height);

            const actualPreset = currentPreset === 4 ? 0 : currentPreset;
            switch(actualPreset) {
                case 0: renderKaleidoscopeTunnel(ctx, width, height, freqData, bass, theme); break;
                case 1: renderWinampSpectrum(ctx, width, height, freqData, timeDataLeft, theme); break;
                case 2: renderWarpStarfield(ctx, width, height, bass, theme); break;
                case 3: renderLissajousScope(ctx, width, height, timeDataLeft, timeDataRight, theme); break;
            }

            // Render to popout mirror window canvas if open & active
            if (popoutWindow && !popoutWindow.closed) {
                try {
                    const mCanvas = popoutWindow.document.getElementById('mirror-canvas');
                    if (mCanvas) {
                        if (mCanvas.width !== popoutWindow.innerWidth || mCanvas.height !== popoutWindow.innerHeight) {
                            mCanvas.width = popoutWindow.innerWidth;
                            mCanvas.height = popoutWindow.innerHeight;
                        }
                        const mCtx = mCanvas.getContext('2d');
                        const mw = mCanvas.width;
                        const mh = mCanvas.height;

                        mCtx.fillStyle = theme.bg;
                        mCtx.fillRect(0, 0, mw, mh);

                        // Save main context dims and use mirror dims
                        const oldW = width, oldH = height;
                        width = mw; height = mh;
                        const targetCtx = mCtx;

                        switch(actualPreset) {
                            case 0: renderKaleidoscopeTunnel(targetCtx, mw, mh, freqData, bass, theme); break;
                            case 1: renderWinampSpectrum(targetCtx, mw, mh, freqData, timeDataLeft, theme); break;
                            case 2: renderWarpStarfield(targetCtx, mw, mh, bass, theme); break;
                            case 3: renderLissajousScope(targetCtx, mw, mh, timeDataLeft, timeDataRight, theme); break;
                        }
                        width = oldW; height = oldH;
                    }
                } catch(e) {
                    // Cross-origin or closed window handled silently
                }
            }
        }

        function renderKaleidoscopeTunnel(targetCtx, w, h, freqData, bass, theme) {
            targetCtx.save();
            targetCtx.translate(w / 2, h / 2);
            rot += 0.005 + bass * 0.02;
            zoom = 1 + bass * 0.35;
            targetCtx.rotate(rot);
            targetCtx.scale(zoom, zoom);

            const segments = 8;
            const angleStep = (Math.PI * 2) / segments;

            for(let s=0; s<segments; s++) {
                targetCtx.rotate(angleStep);
                targetCtx.beginPath();
                for(let i=0; i<freqData.length; i+=3) {
                    let r = i * 4 + bass * 80;
                    let angle = i * 0.05 + time;
                    let x = Math.cos(angle) * r;
                    let y = Math.sin(angle) * r;
                    if(i === 0) targetCtx.moveTo(x, y);
                    else targetCtx.lineTo(x, y);
                }
                targetCtx.strokeStyle = s % 2 === 0 ? theme.primary : theme.secondary;
                targetCtx.lineWidth = 2.5;
                targetCtx.shadowBlur = 15;
                targetCtx.shadowColor = theme.primary;
                targetCtx.stroke();
            }
            targetCtx.restore();
        }

        function renderWinampSpectrum(targetCtx, w, h, freqData, timeData, theme) {
            const barWidth = (w / 32) - 4;
            let x = 20;

            targetCtx.save();
            for(let i=0; i<32; i++) {
                let val = freqData[i * 3];
                let barHeight = (val / 255) * (h * 0.5);

                let grad = targetCtx.createLinearGradient(0, h - 100, 0, h - 100 - barHeight);
                grad.addColorStop(0, theme.primary);
                grad.addColorStop(0.7, theme.secondary);
                grad.addColorStop(1, '#ff0033');

                targetCtx.fillStyle = grad;
                targetCtx.shadowBlur = 10;
                targetCtx.shadowColor = theme.primary;
                targetCtx.fillRect(x, h - 80 - barHeight, barWidth, barHeight);

                x += barWidth + 4;
            }

            targetCtx.beginPath();
            targetCtx.strokeStyle = theme.primary;
            targetCtx.lineWidth = 3;
            targetCtx.shadowBlur = 15;
            targetCtx.shadowColor = theme.primary;
            const sliceWidth = w / timeData.length;
            let wx = 0;
            for(let i=0; i<timeData.length; i++) {
                let v = timeData[i] / 128.0;
                let wy = (h * 0.8) + (v - 1) * 120;
                if(i === 0) targetCtx.moveTo(wx, wy);
                else targetCtx.lineTo(wx, wy);
                wx += sliceWidth;
            }
            targetCtx.stroke();
            targetCtx.restore();
        }

        function renderWarpStarfield(targetCtx, w, h, bass, theme) {
            targetCtx.save();
            targetCtx.translate(w / 2, h / 2);

            particles.forEach(p => {
                p.z -= 4 + bass * 25;
                if(p.z <= 0) p.z = w;

                let k = 300 / p.z;
                let px = p.x * k;
                let py = p.y * k;
                let size = Math.max(1, p.size * k * (1 + bass * 1.5));

                targetCtx.fillStyle = theme.primary;
                targetCtx.beginPath();
                targetCtx.arc(px, py, size, 0, Math.PI * 2);
                targetCtx.fill();
            });

            targetCtx.beginPath();
            targetCtx.arc(0, 0, 80 + bass * 150, 0, Math.PI * 2);
            targetCtx.strokeStyle = theme.secondary;
            targetCtx.lineWidth = 3;
            targetCtx.shadowBlur = 25;
            targetCtx.shadowColor = theme.secondary;
            targetCtx.stroke();

            targetCtx.restore();
        }

        function renderLissajousScope(targetCtx, w, h, timeDataLeft, timeDataRight, theme) {
            targetCtx.save();
            targetCtx.translate(w / 2, h / 2);
            targetCtx.beginPath();
            targetCtx.strokeStyle = theme.primary;
            targetCtx.lineWidth = 2;
            targetCtx.shadowBlur = 20;
            targetCtx.shadowColor = theme.primary;

            for(let i=0; i<timeDataLeft.length; i+=2) {
                let x = (timeDataLeft[i] - 128) * 2.2;
                let y = (timeDataRight[i] - 128) * 2.2;
                if(i === 0) targetCtx.moveTo(x, y);
                else targetCtx.lineTo(x, y);
            }
            targetCtx.stroke();
            targetCtx.restore();
        }
    </script>
</body>
</html>
